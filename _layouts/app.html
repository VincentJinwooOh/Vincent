<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bawkward — 이해중심 교육과정 학습 볼트</title>
  <meta name="description" content="Backward Design + awkward. 도달점에서 거꾸로 설계하고, 학생이 먼저 써 본 뒤 배우는 학습 볼트. 원본은 로컬에, AI에는 마스킹된 질문 초안만.">
  <meta name="theme-color" content="#b1471e">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231c1917'/><text x='50' y='70' font-size='58' text-anchor='middle' transform='scale(-1,1) translate(-100,0)' fill='%23f7f3ec' font-family='monospace' font-weight='bold'>B</text></svg>">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/"><span class="brand-mark">B</span><b>Baw<span class="bk">kw</span>ard</b><small>backward · awkward</small></a>
      <div class="topbar-actions">
        <span class="pill-vault" title="원본은 이 브라우저 볼트에만 있습니다"><span class="dot"></span>로컬 볼트</span>
        <a class="icon-btn" href="#/stats" title="STATEtistics">📈</a>
        <a class="user-chip" href="#/me" id="user-chip" title="마이페이지"></a>
      </div>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main id="view"></main>
    <aside class="rail" id="rail"></aside>
  </div>

  <nav class="bottom-nav" id="bottom-nav"></nav>
  <div id="modal-root" hidden></div>
  <div class="toast-wrap" id="toasts"></div>

  {{ content }}

  <script src="assets/js/data.js"></script>
  <script src="assets/js/ai.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
