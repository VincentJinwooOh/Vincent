# Bawkward — 이해중심 교육과정(백워드 설계) 학습 볼트 (Jekyll / GitHub Pages)
# 앱은 순수 정적 HTML/CSS/JS 로 동작하며, Jekyll 은 레이아웃 조립과 배포에만 쓰인다.
title: Bawkward
email: your-email@example.com
description: >-
  Backward Design + awkward. 도달점에서 거꾸로 설계하고 학생이 먼저 써 본 뒤 배우는 학습 볼트.
  원본은 로컬 볼트에 남고, 외부 모델에는 마스킹된 질문 초안만 오간다.
baseurl: ""
url: ""
lang: ko
plugins:
  - jekyll-feed
collections:
  products:
    output: false
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - docs/
  - README.md
  - .bundle/
  - .ruby-version
