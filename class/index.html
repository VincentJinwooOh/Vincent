<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수업 웹앱 모음</title>
<style>
  body { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: #eef0fb; margin: 0; padding: 40px 20px; color: #1f2233; }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 30px; margin: 0 0 6px; } .sub { color: #6b6f85; margin-bottom: 26px; }
  .card { display: flex; gap: 18px; align-items: center; background: #fff; border-radius: 18px; padding: 22px 26px; text-decoration: none; color: inherit; box-shadow: 0 10px 30px rgba(50,40,120,.10); border: 3px solid transparent; transition: .15s; }
  .card:hover { border-color: #7b5cd6; transform: translateY(-2px); }
  .card .icon { font-size: 46px; } .card h2 { margin: 0 0 4px; font-size: 22px; color: #5a3fb3; } .card p { margin: 0; color: #6b6f85; font-size: 15px; }
  .tag { display: inline-block; background: #ece6fb; color: #5a3fb3; border-radius: 999px; padding: 2px 10px; font-size: 13px; margin-right: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📚 수업 웹앱 모음</h1>
  <div class="sub">교실 대형 화면과 학생 태블릿에서 바로 사용하는 인터랙티브 수업 자료</div>
  <a class="card" href="sun-altitude/">
    <div class="icon">☀️</div>
    <div>
      <h2>계절별 태양의 남중 고도와 낮의 길이</h2>
      <p><span class="tag">과학</span><span class="tag">계절의 변화</span>도입 → 조사 방법 → 가상 관측 → 꺾은선그래프 → 비교·추론 → 계절별 태양 경로 → 정리 퀴즈</p>
    </div>
  </a>
</div>
</body>
</html>
